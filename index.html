<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff85a2;
            --secondary-pink: #ffb7c5;
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #ffe4e9 100%);
            --text-color: #4a4a4a;
            --button-shadow: 0 10px 20px rgba(255, 133, 162, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-color);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 133, 162, 0.1);
            max-width: 500px;
            width: 90%;
            border: 2px solid white;
            z-index: 10;
        }

        .image-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 2rem;
            border-radius: 30px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            font-weight: 800;
            color: #d14d72;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            min-height: 100px;
        }

        button {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--button-shadow);
        }

        .btn-yes {
            background-color: #22c55e;
            color: white;
            z-index: 2;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }

        .btn-no {
            background-color: #ef4444;
            color: white;
            position: relative;
        }

        .hidden {
            display: none;
        }

        /* Floating background hearts */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            opacity: 0.4;
            animation: floatUp linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Success screen */
        .celebration h1 {
            font-size: 2.5rem;
            color: #ff4d6d;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fce;
            z-index: 100;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10px) rotate(0);
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>
    <div class="container" id="main-container">
        <div class="image-container">
            <!-- Using a descriptive Alt while images generate -->
            <div id="image-fallback" style="font-size: 5rem; display: none;">💝</div>
            <img src="https://i.giphy.com/cLS1cfxvGOPVpf9g3y.gif" alt="Cute Waiting Cat" id="cat-img"
                onerror="showFallback()">
        </div>
        <h1 id="question-text">Will you be my Valentine? 💖</h1>
        <div class="buttons" id="button-group">
            <button class="btn-yes" id="yesBtn" onclick="handleYes()">Yes</button>
            <button class="btn-no" id="noBtn" onclick="handleNo()">No</button>
        </div>
    </div>

    <script>
        const noMessages = [
            "Are you sure? 🥺",
            "Think again... 🌹",
            "I'll be very sad... 💔",
            "Please? 🍰",
            "I'll give you chocolate! 🍫",
            "Don't do it! 😿",
            "I'm actually crying now... 😭",
            "Just click Yes already! ✨"
        ];

        let noCount = 0;
        let yesSize = 1.2;

        const catImg = document.getElementById('cat-img');
        const questionText = document.getElementById('question-text');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContainer = document.getElementById('main-container');

        // Absolute most robust Giphy direct links
        const mainGif = "https://i.giphy.com/cLS1cfxvGOPVpf9g3y.gif";
        const pleadingGif = "https://i.giphy.com/vR46O1MpxJj3C7z5mX.gif";
        const happyGif = "https://i.giphy.com/LpDMM4UAnB30W659Mv.gif";

        function showFallback() {
            const img = document.getElementById('cat-img');
            const fallback = document.getElementById('image-fallback');
            if (img) img.style.display = 'none';
            if (fallback) fallback.style.display = 'block';
        }

        function handleNo() {
            noCount++;

            // Update image to pleading
            catImg.src = pleadingGif;

            // Update text
            const msgIndex = Math.min(noCount - 1, noMessages.length - 1);
            noBtn.innerText = noMessages[msgIndex];

            // Grow the Yes button
            yesSize += 0.5;
            yesBtn.style.fontSize = `${yesSize}rem`;
            yesBtn.style.padding = `${1 * yesSize / 1.2}rem ${2.5 * yesSize / 1.2}rem`;

            // On the 8th click, make No button really tiny or hide it
            if (noCount >= 8) {
                noBtn.style.transform = "scale(0.5)";
                noBtn.style.opacity = "0.5";
            }
        }

        function handleYes() {
            mainContainer.classList.add('celebration');
            mainContainer.innerHTML = `
                <div class="image-container">
                    <img src="${happyGif}" alt="Happy Cat">
                </div>
                <h1>Yay! See you on the 14th! 💖✨</h1>
                <p style="margin-top: 2rem; font-size: 1.1rem; opacity: 0.8;">I love you! 🫶</p>
            `;

            launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#ff85a2', '#ffb7c5', '#22c55e', '#ffd700', '#ffffff'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = Math.random() * 2 + 1 + 's';
                confetti.style.opacity = Math.random();
                document.body.appendChild(confetti);

                // Remove confetti after animation
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Floating hearts background
        function createBackgroundHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '✨';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.fontSize = Math.random() * 20 + 10 + 'px';
                heart.style.animationDuration = Math.random() * 5 + 3 + 's';
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 8000);
            }, 800);
        }
        createBackgroundHearts();
    </script>
</body>

</html>
