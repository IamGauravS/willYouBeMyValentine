<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff85a2;
            --secondary-pink: #ffb7c5;
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #ffe4e9 100%);
            --text-color: #4a4a4a;
            --button-shadow: 0 10px 20px rgba(255, 133, 162, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text-color);
            padding: 1rem;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 133, 162, 0.15);
            max-width: 460px;
            width: 90%;
            border: 2px solid white;
            z-index: 10;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 1.5rem;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.3);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 800;
            color: #d14d72;
            line-height: 1.3;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            min-height: 80px;
            flex-direction: column;
        }

        button {
            padding: 0.9rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--button-shadow);
        }

        .btn-yes {
            background-color: #22c55e;
            color: white;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-yes:hover {
            filter: brightness(1.1);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
        }

        .btn-no {
            background-color: #ef4444;
            color: white;
            transition: all 0.3s ease;
        }

        /* Floating background hearts */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            opacity: 0.4;
            animation: floatUp linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Success screen */
        .celebration h1 {
            font-size: 2.2rem;
            color: #ff4d6d;
            animation: pulse 1s ease infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
            }
        }

        .love-text {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            opacity: 0.8;
            color: #d14d72;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 100;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10px) rotate(0);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .image-container {
                width: 180px;
                height: 180px;
            }
        }
    </style>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
    <div class="container" id="main-container">
        <div class="image-container">
            <img src="images/image1.gif" alt="Cute Cat" id="cat-img">
        </div>
        <h1 id="question-text">Will you be my Valentine? 💖</h1>
        <div class="buttons" id="button-group">
            <button class="btn-yes" id="yesBtn" onclick="handleYes()">Yes 💚</button>
            <button class="btn-no" id="noBtn" onclick="handleNo()">No 😢</button>
        </div>
    </div>

    <script>
        // ============================================================
        // EMAIL CONFIGURATION — Fill these in from emailjs.com
        // ============================================================
        // 1. Go to https://www.emailjs.com/ and sign up (free)
        // 2. Add an Email Service (Gmail, Outlook, etc.) → copy SERVICE_ID
        // 3. Create an Email Template → copy TEMPLATE_ID
        //    In the template, use {{message}} for the body text
        // 4. Go to Account → copy your PUBLIC_KEY
        const EMAILJS_SERVICE_ID = 'service_6yvfaev';
        const EMAILJS_TEMPLATE_ID = 'template_9o62ufi'; // ⚠️ This should start with 'template_' — check EmailJS dashboard!
        const EMAILJS_PUBLIC_KEY = '-RsU7zPiJBLg10f2E';

        // Initialize EmailJS
        emailjs.init(EMAILJS_PUBLIC_KEY);

        function sendNotification(action, detail) {
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                message: `💖 Valentine Update: She clicked ${action}! ${detail}`,
            }).then(() => {
                console.log(`Email sent: ${action}`);
            }).catch((err) => {
                console.error('Email failed:', err);
            });
        }
        // ============================================================

        // All images are LOCAL — no CDN issues!
        const gifSequence = [
            "images/image1.gif",  // Default cute cat
            "images/image2.gif",  // After 1st No
            "images/image3.gif",  // After 2nd No
            "images/image4.gif",  // After 3rd No
            "images/image5.gif",  // After 4th No
            "images/image6.gif",  // After 5th No
        ];
        const happyGif = "images/image7.gif";  // Yes celebration!

        const noMessages = [
            "No 😢",
            "Are you sure? 🥺",
            "Pookie please... 🌹",
            "I'll be really sad 💔",
            "I'll give you chocolate! 🍫",
            "I'm gonna cry... 😭",
            "You're breaking my heart 💔",
            "PLEASE just say yes!! 😿",
            "I'll do anything! ✨",
            "Fine... I'll just be sad forever 😞"
        ];

        let noCount = 0;
        let yesFontSize = 1.1;  // rem
        let yesPadV = 0.9;      // rem (vertical padding)
        let yesPadH = 2.2;      // rem (horizontal padding)

        const catImg = document.getElementById('cat-img');
        const questionText = document.getElementById('question-text');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContainer = document.getElementById('main-container');

        function handleNo() {
            noCount++;

            // Send email notification
            sendNotification('NO', `Attempt #${noCount} — "${noMessages[Math.min(noCount, noMessages.length - 1)]}"`);

            // Cycle through the sad cat images
            const imgIndex = Math.min(noCount, gifSequence.length - 1);
            catImg.src = gifSequence[imgIndex];

            // Update "No" button text
            const msgIndex = Math.min(noCount, noMessages.length - 1);
            noBtn.innerText = noMessages[msgIndex];

            // Grow the "Yes" button using actual size (not transform)
            yesFontSize += 0.25;
            yesPadV += 0.15;
            yesPadH += 0.3;
            yesBtn.style.fontSize = `${yesFontSize}rem`;
            yesBtn.style.padding = `${yesPadV}rem ${yesPadH}rem`;

            // Shrink the "No" button using actual size
            const noFontSize = Math.max(0.7, 1.1 - (noCount * 0.06));
            const noPadV = Math.max(0.4, 0.9 - (noCount * 0.05));
            const noPadH = Math.max(1, 2.2 - (noCount * 0.12));
            noBtn.style.fontSize = `${noFontSize}rem`;
            noBtn.style.padding = `${noPadV}rem ${noPadH}rem`;
        }

        function handleYes() {
            // Send email notification
            sendNotification('YES', `She said YES after ${noCount} No clicks! 🎉`);

            mainContainer.classList.add('celebration');
            mainContainer.innerHTML = `
                <div class="image-container">
                    <img src="${happyGif}" alt="Happy Cat">
                </div>
                <h1>YAAAY!! 🎉💖✨</h1>
                <p class="love-text">I knew you'd say yes! See you on the 14th! 🫶</p>
            `;

            launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#ff85a2', '#ffb7c5', '#ff4d6d', '#ffd700', '#22c55e', '#ffffff'];
            for (let i = 0; i < 200; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    const size = Math.random() * 8 + 4;
                    confetti.style.width = size + 'px';
                    confetti.style.height = size + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    confetti.style.animationDuration = Math.random() * 2 + 1.5 + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 15);
            }
        }

        // Floating hearts background
        function createBackgroundHearts() {
            const emojis = ['💖', '✨', '💕', '🌸', '💗'];
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.fontSize = Math.random() * 16 + 12 + 'px';
                heart.style.animationDuration = Math.random() * 5 + 4 + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 9000);
            }, 700);
        }
        createBackgroundHearts();
    </script>
</body>

</html>
